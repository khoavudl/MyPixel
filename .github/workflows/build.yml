name: Build Standalone Packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Chọn nền tảng bạn muốn build:'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'windows'
          - 'macos'
      tag_name:
        description: 'Tên phiên bản Release (ví dụ: v2.7.0):'
        required: true
        default: 'v2.7.0'
        type: string
      publish_release:
        description: 'Tự động xuất bản GitHub Release public (cho tải không cần login):'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe & .zip)
    if: ${{ github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'both' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend UI
        working-directory: ./ui
        run: |
          npm ci || npm install
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip uninstall -y pymupdf-layout pymupdf4llm 2>/dev/null || true

      - name: Build Windows Executable
        run: |
          python scripts/build_windows.py

      - name: Upload Windows Distribution
        uses: actions/upload-artifact@v4
        with:
          name: MyPixel-Windows
          path: dist/MyPixel-Windows.zip
          retention-days: 14

  build-macos:
    name: Build macOS (.app & .zip)
    if: ${{ github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'both' }}
    runs-on: macos-14
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend UI
        working-directory: ./ui
        run: |
          npm ci || npm install
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip uninstall -y pymupdf-layout pymupdf4llm 2>/dev/null || true

      - name: Build macOS Application
        run: |
          python scripts/build_mac.py

      - name: Upload macOS Distribution
        uses: actions/upload-artifact@v4
        with:
          name: MyPixel-macOS
          path: dist/MyPixel-macOS.zip
          retention-days: 14

  publish-release:
    name: Publish Public GitHub Release
    needs: [build-windows, build-macos]
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') && (github.event.inputs.publish_release != false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || 'v2.7.0' }}
          name: MyPixel ${{ github.event.inputs.tag_name || 'v2.7.0' }} (Standalone Desktop)
          body: |
            ## 📦 MyPixel - Packaging Artwork Inspection (Standalone Desktop)

            Bản cài đặt đóng gói độc lập cho Windows và macOS. Chạy trực tiếp dạng Native Desktop Window (không cần cài Python).

            ### 📥 Hướng dẫn tải & sử dụng:
            * **Windows**:
              1. Tải file `MyPixel-Windows.zip` bên dưới.
              2. Giải nén vào thư mục bất kỳ.
              3. Mở file `MyPixel.exe` để bắt đầu kiểm định.
            * **macOS**:
              1. Tải file `MyPixel-macOS.zip` bên dưới.
              2. Giải nén được `MyPixel.app`.
              3. Mở ứng dụng và bắt đầu kiểm định.
          files: release-assets/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
